# csp-front nginx configuration
# Serves the shell build and the federation manifest; the gateway URL lives in the interceptor

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # remoteEntry and the federation manifest must never be cached: they decide
    # which version of every portal the browser loads.
    location ~* (remoteEntry\.js|remoteEntry\.json|federation\.manifest\.json)$ {
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Hashed assets can be cached for a long time
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Main Angular app - fallback to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
