# csp-front nginx configuration
# Serves the shell build and the federation manifest; the environment files are rendered at startup

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # remoteEntry, the federation manifest and config.json must never be cached: they decide
    # which version of every portal the browser loads and where the gateway is.
    # $cors_origin comes from conf.d/cors-origin.conf; it is empty (no header) for any other origin.
    location ~* (remoteEntry\.js|remoteEntry\.json|federation\.manifest\.json|config\.json)$ {
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Vary "Origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Hashed assets can be cached for a long time
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Main Angular app - fallback to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
